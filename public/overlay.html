<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Buzz Overlay — OBS Browser Source</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="/socket.io/socket.io.js"></script>
<style>
  /* Transparent by design — OBS Browser Source shows page alpha. Never paint a page background. */
  html, body { margin: 0; padding: 0; background: transparent !important; }
  body {
    font-family: "Archivo", system-ui, sans-serif; color: #edeff2;
    min-height: 100vh; overflow: hidden;
  }
  #ov {
    position: fixed; left: 50%; transform: translateX(-50%);
    width: min(1060px, 92vw);
  }
  body[data-style="lower-third"] #ov { bottom: 44px; }
  body[data-style="topbar"] #ov { top: 28px; bottom: auto; width: min(900px, 92vw); }
  body[data-style="center"] #ov {
    top: 50%; bottom: auto; transform: translate(-50%, -50%);
    width: min(860px, 90vw); text-align: center;
  }
  body.ov-hidden #ov, body.idle-hidden #ov { display: none !important; }
  .card {
    background: rgba(5, 7, 10, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.30);
    border-radius: 16px;
    padding: 22px 28px 20px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.65);
  }
  .topline {
    display: flex; align-items: center; gap: 12px;
    font-family: "IBM Plex Mono", monospace; font-size: 14px;
    letter-spacing: 0.22em; color: #c8cfd8; text-transform: uppercase;
  }
  .pill {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600;
    letter-spacing: 0.18em; padding: 6px 14px; border-radius: 99px;
    border: 1px solid rgba(255, 255, 255, 0.2); color: #9aa2ae; white-space: nowrap;
  }
  .pill.live { color: #06130c; background: #34d17b; border-color: #34d17b; }
  .pill.locked { color: #c8cfd8; }
  .pill.ready { color: #0a0c0e; background: #d9a441; border-color: #d9a441; }
  .winner {
    font-weight: 800; letter-spacing: -0.02em; line-height: 1.02;
    font-size: clamp(40px, 4.6vw, 72px); margin: 8px 0 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body[data-style="topbar"] .winner { font-size: clamp(28px, 3vw, 44px); }
  .winner .p1 { color: #d9a441; font-size: 0.55em; vertical-align: middle; margin-right: 12px;
    font-family: "IBM Plex Mono", monospace; letter-spacing: 0.1em; }
  .sub {
    font-family: "IBM Plex Mono", monospace; font-size: 14px;
    letter-spacing: 0.08em; color: #c8cfd8;
  }
  .sub b { color: #d9a441; }
  .rows { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .rrow {
    display: flex; align-items: center; gap: 9px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px; padding: 7px 13px 7px 10px;
    font-size: 15px; font-weight: 600;
  }
  .rrow .pos { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: #9aa2ae; }
  .rrow.first { border-color: rgba(217, 164, 65, 0.6); }
  .rrow.first .pos { color: #d9a441; }
  .chip { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .delta { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: #9aa2ae; }
  /* ---------- 3D standings chart (projector corner, large-scale) ----------
   * Pure-CSS isometric bars: front + top + side faces from team colour.
   * Big type so it reads when the OBS source is scaled to a slide corner. */
  #chart { display: none; margin-top: 14px; }
  #chart.show { display: block; }
  .chart-bars {
    display: flex; align-items: flex-end; justify-content: center;
    gap: clamp(10px, 2.4vw, 26px);
    padding: 18px 6px 4px;
    min-height: 340px;
    overflow-x: auto; scrollbar-width: none;
  }
  .chart-bars::-webkit-scrollbar { display: none; }
  @media (max-width: 640px) {
    .bcol { width: 76px; }
    .bar3d { width: 48px; }
    .chart-bars { min-height: 270px; justify-content: flex-start; }
  }
  .bcol {
    display: flex; flex-direction: column; align-items: center;
    width: clamp(104px, 13vw, 150px); min-width: 0;
    animation: colIn .45s cubic-bezier(.2,.9,.25,1.2) both;
  }
  @keyframes colIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  .blabel { text-align: center; max-width: 100%; margin-bottom: 10px; min-height: 92px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
  .blabel .bt {
    font-weight: 800; letter-spacing: -0.01em; line-height: 1.05;
    font-size: clamp(20px, 2.4vw, 30px); color: #fff;
    white-space: normal; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere;
  }
  .bcol.first .blabel .bt { color: #ffd98a; }
  .blabel .bm {
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(14px, 1.5vw, 18px); letter-spacing: 0.06em; color: #d9a441;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .bcol.first .blabel .bm { color: #ffd98a; font-weight: 600; }
  .blabel .bk {
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(11px, 1.2vw, 14px); letter-spacing: 0.08em; color: #bcc4cf;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .bar3d { position: relative; width: clamp(62px, 7.5vw, 92px); height: var(--h, 160px);
    --d: 14px; margin-top: var(--d);
    transition: height .65s cubic-bezier(.2,.9,.25,1.12);
    transform: translateZ(0); }
  .bar-front {
    position: absolute; inset: 0; border-radius: 2px 2px 3px 3px;
    background: linear-gradient(180deg, var(--c-light, #666) 0%, var(--c, #444) 55%, var(--c-dark, #222) 100%);
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 10px;
  }
  .bar-front .ord {
    font-weight: 800; font-size: clamp(19px, 2.2vw, 28px); letter-spacing: 0.02em;
    color: rgba(255,255,255,.95); text-shadow: 0 2px 8px rgba(0,0,0,.5);
    font-variant-numeric: tabular-nums;
  }
  .bar-top {
    position: absolute; left: 0; bottom: 100%; width: 100%; height: var(--d);
    background: var(--c-light, #888);
    transform: skewX(-45deg); transform-origin: bottom left;
    border-radius: 2px;
    filter: brightness(1.12);
  }
  .bar-side {
    position: absolute; left: 100%; top: 0; width: var(--d); height: 100%;
    background: var(--c-dark, #222);
    transform: skewY(-45deg); transform-origin: top left;
    border-radius: 0 2px 3px 0;
    filter: brightness(.82);
  }
  .bcol.first .bar-front { box-shadow: 0 0 0 2px rgba(217,164,65,.75), 0 0 34px rgba(217,164,65,.5), 0 14px 34px rgba(0,0,0,.5); }
  .bcol.first .bar-front .ord { color: #fff; }
  /* Empty slots: flat ghost stubs — a bar rises only when its team buzzes. */
  .bcol.ghost { animation: none; opacity: .6; }
  .bcol.ghost .bar-front {
    background: rgba(255,255,255,.05);
    border: 1px dashed rgba(255,255,255,.28);
    box-shadow: none;
  }
  .bcol.ghost .bar-top { background: rgba(255,255,255,.07); filter: none; }
  .bcol.ghost .bar-side { background: rgba(255,255,255,.03); filter: none; }
  .bcol.ghost .bar-front .ord { color: #8b94a1; text-shadow: none; }
  .bcol.ghost .blabel .bt { color: #8b94a1; }
  .bcol.ghost .blabel .bm { color: #8b94a1; }
  /* 8-slot density: narrower columns so P1..P8 fit the card corner-sized. */
  #chart[data-slots="8"] .chart-bars { gap: clamp(8px, 1.4vw, 16px); }
  #chart[data-slots="8"] .bcol { width: clamp(72px, 8.6vw, 108px); }
  #chart[data-slots="8"] .bar3d { width: clamp(48px, 5.6vw, 68px); }
  #chart[data-slots="8"] .blabel .bt { font-size: clamp(16px, 1.8vw, 24px); }
  #chart[data-slots="8"] .bar-front .ord { font-size: clamp(16px, 1.8vw, 22px); }
  body[data-style="topbar"] #chart[data-slots="8"] .bcol { width: clamp(64px, 7.6vw, 92px); }
  body[data-style="topbar"] #chart[data-slots="8"] .bar3d { width: clamp(44px, 5vw, 60px); }
  .bcol.pop .bar3d { animation: barPop .5s cubic-bezier(.2,.9,.25,1.3); transform-origin: bottom; }
  @keyframes barPop { 0% { transform: scaleY(.86); } 60% { transform: scaleY(1.04); } 100% { transform: scaleY(1); } }
  .bcol.first .bar-front::after {
    content: ""; position: absolute; inset: -2px; border-radius: 4px; pointer-events: none;
    box-shadow: 0 0 22px rgba(255,217,138,.35); animation: p1Glow 2.2s ease-in-out infinite;
  }
  @keyframes p1Glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .chart-foot {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 12px; font-family: "IBM Plex Mono", monospace;
    font-size: clamp(12px, 1.4vw, 15px); letter-spacing: 0.1em; color: #bcc4cf;
    flex-wrap: wrap;
  }
  .chart-foot .more {
    border: 1px solid rgba(255,255,255,.2); border-radius: 99px; padding: 3px 12px;
    color: #edeff2; white-space: nowrap;
  }
  body[data-style="topbar"] .chart-bars { min-height: 250px; padding-top: 12px; }
  body[data-style="topbar"] .bar3d { width: clamp(54px, 6.5vw, 76px); }
  body[data-style="center"] .chart-bars { justify-content: center; }
  @media (prefers-reduced-motion: reduce) {
    .bcol, .bcol.pop .bar3d, .bcol.first .bar-front::after { animation: none; }
    .bar3d { transition: none; }
  }
  .count-big {
    font-weight: 800; font-size: clamp(64px, 9vw, 150px); line-height: 1;
    color: #d9a441; text-align: center; margin: 4px 0;
    font-variant-numeric: tabular-nums;
  }
  .count-sub {
    text-align: center; font-family: "IBM Plex Mono", monospace;
    font-size: 12px; letter-spacing: 0.26em; color: #edeff2;
  }
  /* setup / error pills — only visible outside normal operation (pairing, bad code) */
  #setup, #err {
    position: fixed; left: 50%; top: 40px; transform: translateX(-50%);
    background: rgba(8, 10, 13, 0.94); border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px; padding: 16px 20px; width: min(420px, 92vw);
    display: none; box-shadow: 0 18px 60px rgba(0,0,0,.55);
  }
  #setup.show, #err.show { display: block; }
  #setup h2 { margin: 0 0 4px; font-size: 17px; }
  #setup p { margin: 0 0 12px; font-size: 13px; color: #9aa2ae; }
  #setup .row { display: flex; gap: 8px; }
  #setup input {
    flex: 1; background: #0c0f13; border: 1px solid rgba(255,255,255,.2); color: #edeff2;
    border-radius: 8px; padding: 11px 12px; font-size: 18px; text-align: center;
    font-family: "IBM Plex Mono", monospace; letter-spacing: .35em; text-transform: uppercase; outline: none;
  }
  #setup button {
    background: #34d17b; border: 0; border-radius: 8px; padding: 0 18px;
    font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 12px;
    letter-spacing: .14em; cursor: pointer; color: #06130c;
  }
  #err { text-align: center; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; letter-spacing: .06em; }
</style>
</head>
<body data-style="lower-third">
  <div id="ov" style="display:none">
    <div class="card">
      <div class="topline"><span id="q">Q–</span><span class="pill locked" id="pill">LOCKED</span><span id="count" style="margin-left:auto"></span></div>
      <div id="main"></div>
      <div id="chart"><div class="chart-bars" id="bars"></div><div class="chart-foot" id="chartFoot"></div></div>
      <div class="rows" id="rows"></div>
    </div>
  </div>

  <div id="setup">
    <h2>Buzz overlay</h2>
    <p>Enter the room code from the host console. In OBS, pass it in the URL instead: <span style="font-family:monospace">overlay.html?room=XXXXX</span></p>
    <div class="row"><input id="code" maxlength="5" placeholder="XXXXX"/><button id="join">JOIN</button></div>
  </div>
  <div id="err"></div>

<script src="/js/overlay.js?v=5"></script>
</body>
</html>
